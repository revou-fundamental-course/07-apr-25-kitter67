<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio Saya</title>
    <link rel="stylesheet" href="styles.css">
    
</head>
<body>
    <!-- bagian atas/ navbar  -->
    <header>
        <img src="../kumpulan-gambar/support.png" alt="">
        <nav>
            <ul>
                <li><a href="#about">About</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
        
        <div class="mode-gelap">
            <button></button>
        </div>
    </header>
    
    <!-- bagian utama -->

<!--propil -->
<main>
    
    <section>
        <div class="hero">
            <img src="../kumpulan-gambar/furina-3.jpeg" alt="Foto Profil" id="profile-pic">
            <h1>Hi. saya sidqiw</h1>
            <p>Saya adalah software developer. Di sini saya bereksperimen untuk membuat portofolio saya dan memperlihatkan beberapa project yang saya buat.</p>
        </div>
    </section>


    <section>
        <div class="image-container" id="imageContainer"></div>

        <div class="circle-container">
            <div class="circle" data-image="../kumpulan-gambar/GTR-2.jpg"></div>
            <div class="circle" data-image="../kumpulan-gambar/furina-3.jpeg"></div>
            <div class="circle" data-image="../kumpulan-gambar/elaina-b.jpg"></div>
        </div>
    </section>
<!-- skil-->
    <section>
        <div class="skills">
            <h2>Skills</h2>
            <ul>
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
                <li>Python</li>
                <li>Java</li>
                <li>PHP</li>
            </ul>
        </div>
    </section>
        
<!-- komentar dan pendapat-->
    <section id="form-section">
        <h1 style="text-align: center;">Komentar</h1>
        <div class="data">
            <div class="bungkus">
                <!-- Formulir untuk input pengguna -->
                <form>
                    <input type="text" id="name" name="name" placeholder="Masukan nama"><br>
                    <label for="dob">Tanggal</label><br>
                    <input type="date" id="dob" name="dob" required><br>
                    <label for="male">Laki-laki</label>
                    <input type="radio" id="male" name="gender" value="male">
                    <label for="female">Perempuan</label>
                    <input type="radio" id="female" name="gender" value="female"><br>
                    <textarea id="message" name="message" rows="4" cols="50" placeholder="Berikan komentar"></textarea><br>
    
                    <button type="submit">Kirim</button>
                </form>
            </div>

            <div class="pesan">
                <h2 style="text-align: center;">Pesan anda</h2>
            </div>
        </div>
    </section>

</main>
    
    <script src="main.js"></script>
</body>
</html>
